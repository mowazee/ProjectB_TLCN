# Nginx: phục vụ bundle React và reverse proxy /api tới FastAPI cùng origin (SDD mục 2, 14; ADR-DEPLOY-003).
# Không có location nào trỏ tới storage: file gốc/ảnh trang chỉ đi qua API có kiểm quyền.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Phân giải lại tên "api" qua DNS nội bộ Docker mỗi 10s. Không dùng khối upstream tĩnh: nó chỉ phân giải
    # lúc khởi động, container api được tạo lại (deploy bản mới) đổi IP -> Nginx trả 502 tới khi restart web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Upload một file (MAX_UPLOAD_MB) và lô import (IMPORT_MAX_TOTAL_MB)
    client_max_body_size 520m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass $api_upstream/health;
    }

    # Asset có hash trong tên: cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi route sâu (vd. /documents/123/pages/2) trả index.html (reload URL sâu, NFR-07)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
