# Cấu hình SonarCloud Automatic Analysis (SonarCloud tự quét mỗi PR và nhánh main, không cần token).
# Quality Gate: 0 lỗi bảo mật/độ tin cậy mới, trùng lặp mã mới <= 3%, 100% security hotspot được review.
sonar.sources=backend/app,frontend/src,backend/alembic,.github/workflows,backend/Dockerfile,frontend/Dockerfile
sonar.tests=backend/tests,tests
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,frontend/src/shared/api/schema.d.ts,**/__pycache__/**
sonar.python.version=3.12
