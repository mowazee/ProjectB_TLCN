name: security

# Quét bảo mật mỗi PR (TC2.4, TC2.6): secret lộ trong toàn bộ lịch sử Git (gitleaks) và lỗ hổng thư viện /
# cấu hình sai trong mã nguồn, Dockerfile (Trivy). Lỗ hổng thư viện Python, npm còn được chặn ở backend.yml (pip-audit)
# và frontend.yml (npm audit).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (secret trong lịch sử Git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # quét toàn bộ lịch sử, không chỉ commit cuối
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks-report, path: gitleaks-report.json, if-no-files-found: ignore }

  trivy:
    name: Trivy (lỗ hổng thư viện + cấu hình Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (chặn CRITICAL/HIGH đã có bản sửa)
        run: |
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache aquasec/trivy:0.58.1 fs /src             --scanners vuln,misconfig,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1             --skip-dirs /src/frontend/node_modules --skip-dirs /src/backend/.venv             --format table --output /src/trivy-report.txt
          cat trivy-report.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trivy-report, path: trivy-report.txt, if-no-files-found: ignore }
