name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/openapi.json", "backend/app/**", ".github/workflows/frontend.yml"]
  # PR luôn chạy đủ (không lọc paths): check bắt buộc của branch protection không bị treo ở "pending"
  pull_request:
  workflow_dispatch:

concurrency:
  # push thêm commit vào cùng PR/nhánh -> hủy lần chạy cũ (tiết kiệm phút Actions của repo private)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  openapi-drift:
    # types React phải sinh từ OpenAPI hiện hành (SDD mục 7, 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/*.txt" }
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: python backend/scripts/export_openapi.py
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - name: docs/openapi.json và schema.d.ts phải được commit cùng thay đổi API
        run: git diff --exit-code -- docs/openapi.json frontend/src/shared/api/schema.d.ts

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
