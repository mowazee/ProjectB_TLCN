name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts eval
      - name: import-linter (R1-R10)
        run: lint-imports
      - run: bandit -q -r app -c pyproject.toml
      - run: pip-audit -r requirements.txt --progress-spinner off || true # báo cáo, không chặn

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NFR-09: bộ test MVP xanh khi tắt hoặc bật cờ P2
        features: ["", "workflow,notifications", "highlight,versions,rollback", "handwriting,extraction,classification", "borrowing,notifications,imports", "all"]
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dms_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      # Session store chạy trên Redis thật (giống production) thay vì fakeredis
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dms_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dms
      SESSION_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/*.txt" }
      - run: pip install -r requirements.txt -c constraints.txt
      - name: upgrade -> check (model khớp migration) -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
