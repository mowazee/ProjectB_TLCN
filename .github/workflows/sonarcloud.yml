name: sonarcloud

# Phân tích tĩnh SonarCloud (TC2.4): issue Blocker/Critical, tỉ lệ trùng lặp mã, độ phủ test (đọc coverage.xml backend
# và lcov frontend). Chỉ chạy khi đã cấu hình secret SONAR_TOKEN (hướng dẫn: CONTRIBUTING.md mục 4); chưa có thì bỏ qua.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Chưa cấu hình SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Bỏ qua SonarCloud - chưa có secret SONAR_TOKEN (CONTRIBUTING.md mục 4)."
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/*.txt" }
      - name: Độ phủ backend (SQLite, mọi cờ P2)
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        env: { TEST_FEATURES: all }
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          pytest -q --cov=app --cov-report=xml
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Độ phủ frontend
        if: env.SONAR_TOKEN != ''
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run test:coverage
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env: { SONAR_HOST_URL: "https://sonarcloud.io" }
