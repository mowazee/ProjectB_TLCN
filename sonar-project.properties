# SonarCloud (workflow sonarcloud.yml). Đổi organization/projectKey nếu tạo project SonarCloud với tên khác.
sonar.organization=mowazee
sonar.projectKey=mowazee_ProjectB_TLCN
sonar.projectName=ProjectB_TLCN
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src,tests/e2e
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/tests/**,tests/e2e/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/shared/api/schema.d.ts,**/__pycache__/**
sonar.coverage.exclusions=frontend/src/test/**,frontend/src/main.tsx

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
